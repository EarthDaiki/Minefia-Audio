[package]
name = "minefia-audio"
version = "0.1.0"
description = "A secure streaming audio transcription desktop app"
authors = ["Minefia"]
edition = "2021"

[lib]
name = "minefia_audio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
headless_chrome = { version = "1.0.22", features = ["fetch"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "time", "sync", "macros", "rt", "net", "io-util"] }
reqwest = { version = "0.12", features = ["cookies", "json", "multipart", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
eventsource-stream = "0.2"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
base64 = "0.22"
cpal = "0.15"
keyring = "4"
tempfile = "3"
regex = "1"
aes = "0.9"
cbc = "0.2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.26"
